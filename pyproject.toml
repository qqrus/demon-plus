[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "demon-plus"
version = "0.1.0"
description = "Demand forecasting and model quality monitoring for a small online store"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "scikit-learn>=1.6,<2",
    "structlog>=25.1,<26",
]

[project.scripts]
demon-plus = "demon_plus.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pandas-stubs>=2.2,<3",
    "pre-commit>=4.1,<5",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/demon_plus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
