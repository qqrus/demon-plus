name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.12"
          enable-cache: true
      - name: Install Python and locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check types
        run: uv run --locked mypy
      - name: Test
        run: uv run --locked pytest -W error
      - name: Check installed command
        run: uv run --locked demon-plus check
      - name: Build package
        run: uv build
  container:
    name: Container build and startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker compose config --quiet
      - run: docker build -t demon-plus:ci .
      - run: docker run --rm demon-plus:ci demon-plus check
      - name: API startup without downloaded data
        run: |
          docker run -d --name demon-ci -p 127.0.0.1:8000:8000 demon-plus:ci
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health") as response:
                      result = json.load(response)
                  assert result["status"] == "ok" and result["ready"] is False
                  break
              except OSError:
                  time.sleep(2)
          else:
              raise SystemExit("API startup timed out")
          PY
      - name: Container logs
        if: always()
        run: docker logs demon-ci
